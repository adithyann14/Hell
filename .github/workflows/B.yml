name: Make YOLOv8n ncnn model
on: workflow_dispatch

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics ncnn pnnx

      - name: Export to ncnn (640x640)
        run: python -c "from ultralytics import YOLO; YOLO('yolov8n.pt').export(format='ncnn', imgsz=640)"

      - name: Show result
        run: |
          ls -lh yolov8n_ncnn_model
          head -n 3 yolov8n_ncnn_model/model.ncnn.param
          grep -c "in0" yolov8n_ncnn_model/model.ncnn.param || true
          grep -c "out0" yolov8n_ncnn_model/model.ncnn.param || true

      - uses: actions/upload-artifact@v4
        with:
          name: yolov8n-ncnn
          path: |
            yolov8n_ncnn_model/model.ncnn.param
            yolov8n_ncnn_model/model.ncnn.bin
